services:
  - type: web
    name: hedge-fund-oms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OMS_SECRET_KEY
        generateValue: true
      - key: OMS_DATABASE_URL
        value: sqlite:///./oms.db