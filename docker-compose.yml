version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OMS_SECRET_KEY=dev-only-change-me
      - OMS_DATABASE_URL=sqlite:///./oms.db
    volumes:
      - backend_data:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend_data:
